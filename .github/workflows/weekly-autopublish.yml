# 北京时间每周一 08:55：生成上一完整周周报 → 官网/RSS 摘录 → AI 按七板块填写（无 Secret 时兜底）→ validate → build → push → Vercel
# 依赖：Settings → Actions → Workflow permissions → Read and write permissions
# 满篇干货：Secrets 配 ANTHROPIC_API_KEY，或 OPENAI_API_KEY（国内可用 DeepSeek，见 config/weekly-fill.json 说明）；无密钥时仍会产出兜底正文，避免周报缺页。

name: Weekly skeleton and publish

on:
  schedule:
    # GitHub cron 使用 UTC：北京时间周一 08:55（主）+ 多轮补偿。
    # GitHub schedule 不是准点 SLA，多触发几次可降低漏发概率；脚本会跳过已有正文。
    - cron: "55 0 * * 1"
    - cron: "20 1 * * 1"
    - cron: "5 2 * * 1"
    - cron: "5 4 * * 1"
    - cron: "5 6 * * 1"
  workflow_dispatch:
    inputs:
      force_fill:
        description: 勾选=强制按七板块重写有内容的板块（覆盖目标周已有正文）
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: weekly-autopublish
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create weekly skeleton
        env:
          SKIP_BUILD: "1"
        run: node scripts/create-weekly-report.mjs

      - name: Append RSS digest
        env:
          SKIP_BUILD: "1"
        run: node scripts/append-weekly-digest.mjs

      - name: Fill concise business sections
        env:
          CI: "true"
          WEEKLY_PUBLISH_SOURCE: "github-actions"
          FORCE_WEEKLY_FILL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fill == true && 'true' || 'false' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: node scripts/fill-weekly-content.mjs

      - name: Validate weekly report is publishable
        run: node scripts/validate-weekly-content.mjs

      - name: Build site
        run: npm run build

      - name: Write publish status
        env:
          WEEKLY_PUBLISH_SOURCE: "github-actions"
        run: node scripts/write-weekly-status.mjs

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(weekly): digest + AI draft $(date -u +%Y-%m-%dT%H:%MZ)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main"
